spring.application.name=restaurant
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

# ---- Elasticsearch ----------------------------------------------------------
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

# ---- Keycloak / JWT validation ----------------------------------------------
# issuer-uri must match the "iss" claim inside tokens, i.e. the URL the BROWSER uses.
# jwk-set-uri can point at the internal Docker hostname so the backend never needs
# to reach Keycloak through the public URL.
app.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/restaurant-review}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${app.keycloak.issuer-uri}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${app.keycloak.issuer-uri}/protocol/openid-connect/certs}

# ---- Keycloak Admin API (used to grant RESTAURANT_OWNER on approval) --------
app.keycloak.server-url=${KEYCLOAK_URL:http://localhost:9090}
app.keycloak.realm=${KEYCLOAK_REALM:restaurant-review}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:restaurant-review-backend}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me-dev-secret}

# ---- Photos ------------------------------------------------------------------
app.storage.location=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Geocoding ---------------------------------------------------------------
# nominatim = real addresses via OpenStreetMap, random = fake London coordinates (dev only)
app.geocoding.provider=${GEOCODING_PROVIDER:nominatim}
app.geocoding.nominatim-url=https://nominatim.openstreetmap.org
app.geocoding.user-agent=${GEOCODING_USER_AGENT:restaurant-review-platform/1.0 (set-your-contact-email)}

# ---- Ops ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.level.com.paras.restaurant=INFO
